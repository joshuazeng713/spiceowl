[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spiceowl"
version = "0.3.0a1"
description = "Circuit simulation engine SDK and CLI for CircuitGit's Codex workflow"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "SpiceOwl contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.optional-dependencies]
# Historical MCP compatibility/protocol tests only. CircuitGit calls the Python
# SDK through its existing Codex channel; the engine requires no MCP service.
mcp = ["mcp==1.30.0"]
adctools = ["numpy>=1.26,<3", "scipy>=1.11,<2", "adctoolbox==0.9.3"]

[project.scripts]
spiceowl = "spiceowl.cli.main:main"
spiceowl-adctools = "spiceowl.adctools.__main__:main"

[project.urls]
Repository = "https://github.com/spiceowl-dev/spiceowl"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spiceowl = ["web/static/*"]
