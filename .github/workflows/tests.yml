name: Connectivity and offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the local package
        run: python -m pip install --no-deps .
      - name: Test the installed distribution
        run: python -m unittest discover -s tests
      - name: Check CLI and bundled browser assets
        run: |
          spiceowl --version
          python -c "from importlib.resources import files; root=files('spiceowl.web').joinpath('static'); assert all(root.joinpath(n).is_file() for n in ('index.html','app.js','app.css','owl.svg'))"
          git diff --check

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test offline host configuration and Agent channel
        run: |
          node tests/ui-host-onboarding.mjs
          node tests/ui-agent-channel.mjs
          node tests/workflow-page.mjs

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional MCP SDK and local package
        run: python -m pip install '.[mcp]'
      - name: Test real stdio MCP protocol against local fixtures
        run: python -m unittest discover -s tests

  adctools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical extra and verify dependency consistency
        run: |
          python -m pip install '.[adctools]'
          python -m pip check
          python -VV
          python -m pip freeze --all
      - name: Run actual numerical and pinned upstream tests without skips
        run: |
          python - <<'PY'
          import importlib.metadata
          import unittest
          import numpy, scipy, adctoolbox
          assert importlib.metadata.version('adctoolbox') == '0.9.3'
          suite = unittest.TestSuite([
              unittest.defaultTestLoader.discover('tests', pattern='test_adctools.py'),
              unittest.defaultTestLoader.discover('tests', pattern='test_ac_dc.py'),
          ])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and not result.skipped
          PY
          spiceowl-adctools --help

  developer-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up the pinned editable developer environment
        run: python scripts/setup_dev.py --no-python-download
      - name: Recheck without installation and verify repository links
        run: |
          python scripts/setup_dev.py --check-only
          .venv/bin/python scripts/check_links.py
          .venv/bin/python -m unittest tests.test_dev_setup
